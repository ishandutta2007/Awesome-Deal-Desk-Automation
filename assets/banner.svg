<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .node-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #38bdf8; }
    .node-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashOffset {
      to { stroke-dashoffset: -40; }
    }
    .animated-bg { animation: pulseGlow 6s infinite ease-in-out; transform-origin: center; }
    .floating { animation: floatParticle 4s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8 8; animation: dashOffset 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Glow & Grid -->
  <circle cx="200" cy="180" r="180" fill="url(#accentGlow)" class="animated-bg" />
  <circle cx="1000" cy="100" r="150" fill="url(#accentGlow)" class="animated-bg" style="animation-delay: -3s;" />

  <!-- Flow Visualizations in Background (Lower Opacity / Z-Index behind text) -->
  <g opacity="0.35">
    <path d="M 150 290 L 350 290 L 550 290 L 750 290 L 950 290 L 1050 290" stroke="#6366f1" stroke-width="2" fill="none" class="flow-line"/>
    
    <!-- Flow Nodes -->
    <rect x="100" y="270" width="100" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="295" text-anchor="middle" class="node-title" font-size="12">1. Opportunity</text>

    <rect x="300" y="270" width="100" height="40" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="350" y="295" text-anchor="middle" class="node-title" font-size="12">2. Guided CPQ</text>

    <rect x="500" y="270" width="100" height="40" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="550" y="295" text-anchor="middle" class="node-title" font-size="12">3. Deal Approval</text>

    <rect x="700" y="270" width="100" height="40" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="750" y="295" text-anchor="middle" class="node-title" font-size="12">4. eSignature</text>

    <rect x="900" y="270" width="110" height="40" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="955" y="295" text-anchor="middle" class="node-title" font-size="12">5. Auto-Billing</text>
  </g>

  <!-- Foreground Main Title & Subtitle Section -->
  <g transform="translate(60, 65)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
    <text x="140" y="21" text-anchor="middle" class="badge-text">⚡ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Title -->
    <text x="0" y="85" class="title">Awesome Deal Desk Automation 💼</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Architecting Quote-to-Cash, Guided CPQ, Approvals &amp; Billing Systems</text>
    
    <!-- Feature Pill Tags -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="55" y="18" text-anchor="middle" class="badge-text" fill="#38bdf8">🤖 Agentic CPQ</text>

      <rect x="120" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="185" y="18" text-anchor="middle" class="badge-text" fill="#818cf8">📜 Quote-to-Cash</text>

      <rect x="260" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="330" y="18" text-anchor="middle" class="badge-text" fill="#c084fc">💳 Usage Billing</text>

      <rect x="410" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
      <text x="470" y="18" text-anchor="middle" class="badge-text" fill="#4ade80">🔓 Open-Source</text>
    </g>
  </g>
</svg>
